<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name = "viewport"

    <style>

            background: #0f172a;

            display: flex;

        }

        .rec1 {
            position: fixed;
            width: 200px;
            height: 100%;
            background: #ff7a00;
            transform: rotate(-30deg);
            left: 900px;
            top: -150px;
            filter: brightness(1.0);
        }

        .rec2 {
            position: fixed;
            width: 200px;
            height: 100%;
            background: #c60000eb;
            transform: rotate(-30deg);
            left: 1200px;
            top: -150px;
            filter: brightness(1.0);
        }

        .rec3 {
            position: fixed;
            width: 200px;
            height: 500px;
            background: #ff820c;
            transform: rotate(-30deg);
            left: 195px;
            top: 260px;

        }

        .rec4 {
            position: fixed;

        }

        .rec5 {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgb(140, 140, 140);
            transform: rotate(-30deg);
            left: 1081px;
            top: 310px;
            animation: bm1 1s infinite alternate;
        }



        .rec6 {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgb(178, 177, 177);
            transform: rotate(-30deg);
            left: 16px;
            top: 100px;
            animation: bm2 1s infinite alternate;
        }

        @keyframes bm1 {
            from {
                transform: rotate(-30deg) translateY(0px);

            }

            to {
                transform: rotate(-30deg) translateY(15px);
            }

        }

        @keyframes bm2 {
            from {
                transform: rotate(-30deg) translateY(0px);

            }

            to {
                transform: rotate(-30deg) translateY(-15px);
            }

        }

        .rec7 {
            width: 300px;
            height: 400px;
            border: 1px solid white;
            border-radius: 10px;
            color: white;
            padding: 10px 10px 10px;
            animation: b 1s ease-in-out forwards;
            background-color: none;
        }

        @keyframes b {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }

        input {
            background: none;
            border: 1px solid white;
            width: 300px;
            text-align: center;
            margin: 0 0 10px;
            height: 30px;
            border-radius: 10px;
            transition: 0.3s ease;
            color: white;
        }

        input:hover {
            height: 34px;
        }


        .u,
        .p {
            font-size: larger;
            position: relative;
            top: 15px;
        }

        .W {
            text-align: center;
            font-size: 25px;
        }

        button {
            width: 100px;
            height: 40px;
            background: rgb(236, 236, 236);
            border: none;
            border-radius: 12px;
            text-overflow: clip;
            transition: 0.3s ease;
            position: relative;
            top: -25px;
        }

        button:hover {
            width: 105px;
            height: 45px;
            filter: brightness(1.3);
        }

        .bu {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-size: larger;
            background: none;
        }

        h4 {
            position: relative;
            top: -10px;
            text-align: center;
        }

        a {
            color: red;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        a ::after {
            font-size: 25px;
            transition: all 0.3s ease;
        }
    </style>
</head>

</html>
