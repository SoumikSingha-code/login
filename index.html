<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    background:#0f172a;
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
}

/* background rotated strips */

.rec1,.rec2,.rec3,.rec4{
    position:fixed;
    width:14vw;
    min-width:120px;
    transform:rotate(-30deg);
}

.rec1{height:60vh;background:#ff7a00;left:70vw;top:-10vh;}
.rec2{height:100vh;background:#c60000eb;left:85vw;top:-10vh;}
.rec3{height:60vh;background:#ff820c;left:12vw;top:40vh;}
.rec4{height:100vh;background:#c60000eb;left:-8vw;top:10vh;}

/* animated squares */

.rec5,.rec6{
    position:fixed;
    width:12vw;
    min-width:100px;
    height:12vw;
    min-height:100px;
    background:gray;
    transform:rotate(-30deg);
}

.rec5{
    left:80vw;
    top:45vh;
    animation:bm1 1s infinite alternate;
}

.rec6{
    left:2vw;
    top:12vh;
    animation:bm2 1s infinite alternate;
}

@keyframes bm1{
    from{transform:rotate(-30deg) translateY(0);}
    to{transform:rotate(-30deg) translateY(15px);}
}

@keyframes bm2{
    from{transform:rotate(-30deg) translateY(0);}
    to{transform:rotate(-30deg) translateY(-15px);}
}

/* login card */

.rec7{
    width:90%;
    max-width:400px;
    border:1px solid white;
    border-radius:12px;
    color:white;
    padding:20px;
    animation:b 1s ease-in-out forwards;
}

@keyframes b{
    from{opacity:0;}
    to{opacity:1;}
}

.W{
    text-align:center;
    font-size:26px;
    margin-bottom:15px;
}

/* labels */

.u,.p{
    margin-top:10px;
    margin-bottom:5px;
}

/* inputs */

input{
    background:none;
    border:1px solid white;
    width:100%;
    height:40px;
    text-align:center;
    border-radius:10px;
    margin-bottom:15px;
    color:white;
}

/* button */

#button{
    width:100%;
    height:45px;
    background:#ececec;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

#button:hover{
    transform:scale(1.03);
}

/* signup text */

h4{
    text-align:center;
    font-weight:normal;
}

a{
    color:red;
    font-size:18px;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

/* desktop enhancement */

@media (min-width:900px){
    .rec7{
        max-width:420px;
        padding:25px;
    }
}

</style>
</head>

<body>

<div class="rec1"></div>
<div class="rec2"></div>
<div class="rec3"></div>
<div class="rec4"></div>
<div class="rec5"></div>
<div class="rec6"></div>

<div class="rec7">
    <p class="W">WELCOME BACK</p>

    <div class="u">User Name :</div>
    <input type="text" placeholder="Enter your user Id" id="name">

    <div class="p">Password :</div>
    <input type="password" placeholder="Enter your Password" id="pass">

    <h4>
        New to this website? 
        <a href="new.html"><b>Sign up</b></a>
    </h4>

    <button id="button" type="button" onclick="save()">Sign in</button>
</div>

<script>

function save(){

    const name=document.getElementById("name").value;
    const pass=document.getElementById("pass").value;

    if(name===""){
        alert("Enter the user name!");
        return;
    }

    if(pass===""){
        alert("Enter the password!");
        return;
    }

    const name1=localStorage.getItem("nam");
    const pass1=localStorage.getItem("pas");

    if(name===name1){
        if(pass===pass1){
            window.location.href="new.html";
        }
        else{
            alert("Wrong password!");
        }
    }
    else{
        alert("Wrong user name!");
    }
}

</script>

</body>
</html>
